name: Rebuild knowledge index

on:
  push:
    branches: ["main"]
    paths:
      - "knowledge/**"
  workflow_dispatch:   # allow manual re-index

jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit chunks.jsonl back to the repo

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        run: python scripts/ingest.py --knowledge-dir knowledge --output-dir index

      - name: Commit updated index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index/chunks.jsonl
          git diff --cached --quiet || git commit -m "chore: rebuild knowledge index [skip ci]"
          git push
